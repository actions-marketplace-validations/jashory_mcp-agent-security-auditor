name: 'MCP & Agent Security Auditor'
description: 'Audit Model Context Protocol (mcp.json) configs, agent hooks, and SKILL.md files for security risks.'
author: 'HM Shihabuddin Jashory (@jashory)'
branding:
  icon: 'lock'
  color: 'red'
inputs:
  target:
    description: 'Directory or file path to scan'
    required: false
    default: '.'
  ci:
    description: 'Fail CI workflow if HIGH or CRITICAL vulnerabilities are detected'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Run MCP & Agent Security Audit
      shell: bash
      run: |
        if [ "${{ inputs.ci }}" = "true" ]; then
          python3 "${{ github.action_path }}/mcp_security_auditor.py" --target "${{ inputs.target }}" --ci
        else
          python3 "${{ github.action_path }}/mcp_security_auditor.py" --target "${{ inputs.target }}"
        fi
